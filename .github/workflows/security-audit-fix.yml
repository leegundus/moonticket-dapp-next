name: Safe npm audit fixes

on:
  push:
    branches:
      - security-updates
    paths:
      - .github/workflows/security-audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security-updates

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Show remaining audit issues
        run: npm audit || true

      - name: Commit safe lockfile fixes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No additional safe lockfile fixes were available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply safe npm audit fixes"
          git push origin security-updates

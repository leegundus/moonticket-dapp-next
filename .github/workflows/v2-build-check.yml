name: MoonTicket V2 Build Check

on:
  push:
    branches:
      - moonticket-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_RPC_URL: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_TIX_MINT: 8e9Mqnczw7MHjdjYaRe3tppbXgRdT6bqTyR3n8b4C4Ek
          SUPABASE_URL: https://ncgdyiijyjozszkaumrk.supabase.co
